org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M
org.gradle.parallel=true
unityStreamingAssets=**STREAMING_ASSETS**
# LiteRtBridge.androidlib applies the Kotlin Gradle plugin bundled with AGP 9 (Unity sets builtInKotlin=false),
# which only works with AGP's legacy DSL. LiteRT-LM ships Java 21 bytecode that Unity's JDK 17 javac can't read,
# so the bridge has to be Kotlin.
android.newDsl=false
